appId: com.gameindex.app
productName: GameIndex
copyright: Copyright © GameIndex

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# better-sqlite3 ships a native binary; it cannot be loaded from inside asar.
asarUnpack:
  - node_modules/better-sqlite3/**
  - "**/*.node"

extraResources:
  - from: build/tray.png
    to: tray.png

asar: true

# Native modules ship N-API prebuilds that load in both Node and Electron (the
# packaged app is smoke-tested with them). Running @electron/rebuild would
# compile them with node-gyp, which refuses a project path containing spaces
# ("Attempting to build a module with a space in the path"). Skip it; the
# prebuilt binaries are what we ship and test.
npmRebuild: false

# Refuse to package a native addon built for another OS (the cross-build trap:
# node-datachannel compiles one binary per host, so a Linux AppImage produced on
# a Windows checkout ships a Windows .node and WebRTC/torrents break).
beforePack: scripts/before-pack.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  # Native modules ship prebuilds for every OS; only Windows x64 is loadable
  # here. Exclude the rest (and SQLite's build-only sources), then re-include
  # the one binary each module needs.
  files:
    - out/**/*
    - package.json
    - "!**/*.map"
    - "!node_modules/better-sqlite3/deps/**"
    - "!node_modules/better-sqlite3/src/**"
    - "!node_modules/better-sqlite3/build/**"
    - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
    - "!node_modules/better-sqlite3/prebuilds/linux*.node"
    - "!node_modules/better-sqlite3/prebuilds/win32-arm64.node"
    - "!node_modules/utp-native/prebuilds/darwin-*/**"
    - "!node_modules/utp-native/prebuilds/linux-*/**"
    - "!node_modules/utp-native/prebuilds/win32-ia32/**"
    - "!node_modules/fs-native-extensions/prebuilds/android-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/darwin-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/linux-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/win32-arm64/**"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}_electron_${version}_x64-setup.${ext}

portable:
  artifactName: ${productName}_electron_${version}_x64_portable.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Game
  # The Linux build is x64 only; keep the Debian arch token (`amd64`) in both
  # the AppImage and deb names so the two branches ship identical patterns.
  artifactName: ${productName}_electron_${version}_amd64.${ext}
  # The Linux targets need a >= 512px icon (build/icon.png is 1024x1024, taken
  # from the macOS icns); a 256px source is rejected by app-builder.
  icon: build/icon.png
  executableName: gameindex
  # deb refuses to build without a maintainer, and electron-builder needs an
  # address (the package.json author carries none).
  maintainer: GameIndex <noreply@gameindex.app>
  # Electron derives WM_CLASS from the desktop file name; without this the
  # running window is not associated with the launcher entry (icon/taskbar).
  syncDesktopName: true
  # Mirror of the Windows prebuild filter: only the binaries loadable on Linux
  # are shipped. The platform `files` list replaces the base one, so the app
  # entries are repeated here (see the note under `win.files`).
  files:
    - out/**/*
    - package.json
    - "!**/*.map"
    - "!node_modules/better-sqlite3/deps/**"
    - "!node_modules/better-sqlite3/src/**"
    - "!node_modules/better-sqlite3/build/**"
    - "!node_modules/better-sqlite3/prebuilds/darwin-*.node"
    - "!node_modules/better-sqlite3/prebuilds/win32*.node"
    - "!node_modules/utp-native/prebuilds/darwin-*/**"
    - "!node_modules/utp-native/prebuilds/win32-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/android-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/darwin-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/ios-*/**"
    - "!node_modules/fs-native-extensions/prebuilds/win32-*/**"

mac:
  target:
    - dmg
  category: public.app-category.games
  icon: build/icon.icns
