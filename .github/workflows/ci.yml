name: CI

on:
  push:
    branches: [main, master, electron]
  pull_request:
    branches: [main, master, electron]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # Builds main + preload + renderer into out/ (electron-vite).
      - name: Build
        run: npm run build

      - name: Verify bundle outputs
        run: |
          test -f out/main/index.cjs
          test -f out/preload/index.cjs
          test -f out/renderer/index.html
          node scripts/check-bundle.mjs

      # Packaging check for the Linux target the release workflow ships. The
      # `--dir` stage builds the asar, applies the linux `files` filter and runs
      # the `beforePack` native-architecture guard without needing AppImage/deb
      # tooling, so a broken package layout fails the PR instead of the tag.
      - name: Package Linux (unpacked)
        run: npx electron-builder --linux --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
