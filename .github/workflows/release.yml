name: "Release Electron App"

on:
  push:
    tags:
      - "v*-electron"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            package: "dist:win"
            artifact_target: "win32"
          - platform: "ubuntu-latest"
            package: "dist:linux"
            artifact_target: "linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      # Both the tag and the artifact version come from package.json: on
      # workflow_dispatch github.ref_name is a branch, not a release tag.
      - name: resolve release tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-electron" >> "$GITHUB_OUTPUT"

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm run test

      # electron-builder outputs installers to release/ (see electron-builder.yml).
      # API keys are baked into the main bundle at build time (electron.vite
      # `define: __GI_BAKED_ENV__`), mirroring the old Rust build.rs contract.
      - name: build and package
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENCRITIC_RAPIDAPI_KEY: ${{ secrets.OPENCRITIC_RAPIDAPI_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: npm run ${{ matrix.package }}

      # A changed artifactName template must fail here, not surface as a
      # release with the old names.
      - name: verify artifact names
        run: node scripts/check-electron-artifacts.mjs ${{ matrix.artifact_target }}

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "GameIndex Electron v${{ steps.meta.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-updater consumes latest*.yml, not the Tauri latest.json. Publish
  # those files to a rolling channel release so the Electron feed has a stable
  # URL while the versioned release stays a human-reviewed draft.
  finalize-release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: resolve release tag
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-electron" >> "$GITHUB_OUTPUT"

      - name: publish updater channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          channel="electron-latest"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag does not exist; nothing to finalize."
            exit 0
          fi

          gh release view "$channel" >/dev/null 2>&1 || \
            gh release create "$channel" \
              --prerelease \
              --title "GameIndex Electron updates" \
              --notes "Rolling electron-updater feed for the Electron build."

          # Surface the versioned release's notes in the update modal.
          notes="$(gh release view "$tag" --json body --jq '.body // ""')"
          if [ -n "$notes" ]; then
            gh release edit "$channel" --notes "$notes" >/dev/null
          fi

          assets="$(mktemp -d)"
          gh release download "$tag" \
            -p '*.exe' -p '*.AppImage' -p '*.deb' -p '*.blockmap' -p 'latest*.yml' \
            -D "$assets" --clobber

          if compgen -G "$assets/*" >/dev/null; then
            # Drop only assets older than two weeks: that clears superseded
            # versions without deleting the other platform's fresh artifacts
            # when one build job in the matrix failed.
            cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            gh release view "$channel" --json assets \
              --jq --arg cutoff "$cutoff" '.assets[] | select(.createdAt < $cutoff) | .name' |
              while read -r name; do
                if [ -n "$name" ]; then
                  gh release delete-asset "$channel" "$name" --yes >/dev/null 2>&1 || true
                fi
              done
            gh release upload "$channel" "$assets"/* --clobber
          else
            echo "::warning::No updater artifacts found on $tag"
          fi
