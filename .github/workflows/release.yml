name: "Release App"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: build and publish tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action automatically replaces __VERSION__ with the package version
          releaseName: "GameIndex v__VERSION__"
          releaseBody: "See the assets below to download GameIndex."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      # tauri-action uploads the NSIS installer (+ updater artifacts) only -
      # the MSI is excluded via bundle.targets: ["nsis"] in tauri.conf.json.
      # Add the portable executable next to it on the same release, named with
      # the same version as the installer (GameIndex_<version>_x64-setup.exe).
      - name: upload portable executable
        run: |
          $version = node -p "require('./package.json').version"
          Copy-Item src-tauri/target/release/GameIndex.exe "GameIndex_${version}_x64_portable.exe"
          gh release upload "${{ github.ref_name }}" "GameIndex_${version}_x64_portable.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
