name: "Release App"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            package: "dist:win"
          - platform: "ubuntu-latest"
            package: "dist:linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm run test

      # electron-builder outputs installers to release/ (see electron-builder.yml).
      # API keys are baked into the main bundle at build time (electron.vite
      # `define: __GI_BAKED_ENV__`), mirroring the old Rust build.rs contract.
      - name: build and package
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENCRITIC_RAPIDAPI_KEY: ${{ secrets.OPENCRITIC_RAPIDAPI_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: npm run ${{ matrix.package }}

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# NOTE(electron-port): the Tauri job also published a signed `latest.json` for
# `tauri-plugin-updater`. The Electron build uses `electron-updater`, which
# consumes the `latest*.yml` files electron-builder emits above. Until the
# updater is wired (`src/shims/tauri-plugin-updater.ts` is a stub), those files
# are uploaded but unused.
