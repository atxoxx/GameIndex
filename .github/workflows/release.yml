name: "Release Electron App"

on:
  push:
    tags:
      - "v*-electron"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            package: "dist:win"
          - platform: "ubuntu-latest"
            package: "dist:linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      # Both the tag and the artifact version come from package.json: on
      # workflow_dispatch github.ref_name is a branch, not a release tag.
      - name: resolve release tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-electron" >> "$GITHUB_OUTPUT"

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm run test

      # electron-builder outputs installers to release/ (see electron-builder.yml).
      # API keys are baked into the main bundle at build time (electron.vite
      # `define: __GI_BAKED_ENV__`), mirroring the old Rust build.rs contract.
      - name: build and package
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENCRITIC_RAPIDAPI_KEY: ${{ secrets.OPENCRITIC_RAPIDAPI_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: npm run ${{ matrix.package }}

      # A changed artifactName template must fail here, not surface as a
      # release with the old names.
      - name: verify artifact names
        run: node scripts/check-electron-artifacts.mjs

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "GameIndex Electron v${{ steps.meta.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-updater consumes latest*.yml, not the Tauri latest.json. Publish
  # those files to a rolling channel release so the Electron feed has a stable
  # URL while the versioned release stays a human-reviewed draft.
  finalize-release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: resolve release tag
        id: meta
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-electron" >> "$GITHUB_OUTPUT"

      - name: publish updater channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          channel="electron-latest"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag does not exist; nothing to finalize."
            exit 0
          fi

          gh release view "$channel" >/dev/null 2>&1 || \
            gh release create "$channel" \
              --prerelease \
              --title "GameIndex Electron updates" \
              --notes "Rolling electron-updater metadata for the Electron build."

          metadata="$(mktemp -d)"
          gh release download "$tag" -p 'latest*.yml' -D "$metadata" --clobber

          if compgen -G "$metadata/latest*.yml" >/dev/null; then
            gh release upload "$channel" "$metadata"/latest*.yml --clobber
          else
            echo "::warning::No latest*.yml assets found on $tag"
          fi
