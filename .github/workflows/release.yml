name: "Release Electron App"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            package: "dist:win"
            artifact_target: "win32"
          - platform: "ubuntu-latest"
            package: "dist:linux"
            artifact_target: "linux"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      # Releases are produced from plain `v<version>` tags on main. The tag must
      # match package.json and its commit must be on main; manual dispatches are
      # only allowed from main. This keeps the deprecated electron branch (and
      # legacy v*-electron / v*-tauri tags) from publishing builds.
      - name: resolve release tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be plain x.y.z (got $version)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($tag)."
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Manual releases must be dispatched from main."
            exit 1
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump package.json or push a new tag."
            exit 1
          fi
          git fetch origin main --quiet
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$commit is not on main; release builds are main-only."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm run test

      # electron-builder outputs installers to release/ (see electron-builder.yml).
      # API keys are baked into the main bundle at build time (electron.vite
      # `define: __GI_BAKED_ENV__`), mirroring the old Rust build.rs contract.
      - name: build and package
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          OPENCRITIC_RAPIDAPI_KEY: ${{ secrets.OPENCRITIC_RAPIDAPI_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
        run: npm run ${{ matrix.package }}

      # A changed artifactName template must fail here, not surface as a
      # release with the old names.
      - name: verify artifact names
        run: node scripts/check-electron-artifacts.mjs ${{ matrix.artifact_target }}

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "GameIndex v${{ steps.meta.outputs.version }}"
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-updater consumes latest*.yml, not the Tauri latest.json. Publish
  # those files to a rolling channel release so the Electron feed has a stable
  # URL, then publish the versioned release once both platform builds succeeded.
  finalize-release:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: resolve release tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be plain x.y.z (got $version)"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($tag)."
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Manual releases must be dispatched from main."
            exit 1
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump package.json or push a new tag."
            exit 1
          fi
          git fetch origin main --quiet
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$commit is not on main; release builds are main-only."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: publish updater channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          channel="electron-latest"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::warning::Release $tag does not exist; nothing to finalize."
            exit 0
          fi

          gh release view "$channel" >/dev/null 2>&1 || \
            gh release create "$channel" \
              --prerelease \
              --title "GameIndex updates" \
              --notes "Rolling electron-updater feed for GameIndex."

          # Surface the versioned release's notes in the update modal.
          notes="$(gh release view "$tag" --json body --jq '.body // ""')"
          if [ -n "$notes" ]; then
            gh release edit "$channel" --notes "$notes" >/dev/null
          fi

          assets="$(mktemp -d)"
          gh release download "$tag" \
            -p '*.exe' -p '*.AppImage' -p '*.deb' -p '*.blockmap' -p 'latest*.yml' \
            -D "$assets" --clobber

          if compgen -G "$assets/*" >/dev/null; then
            # Drop only assets older than two weeks: that clears superseded
            # versions without deleting the other platform's fresh artifacts
            # when one build job in the matrix failed.
            cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            gh release view "$channel" --json assets \
              --jq --arg cutoff "$cutoff" '.assets[] | select(.createdAt < $cutoff) | .name' |
              while read -r name; do
                if [ -n "$name" ]; then
                  gh release delete-asset "$channel" "$name" --yes >/dev/null 2>&1 || true
                fi
              done
            gh release upload "$channel" "$assets"/* --clobber
            # Both platform jobs succeeded (finalize depends on the whole
            # matrix), so the draft is complete: publish it and mark it latest.
            gh release edit "$tag" --draft=false --latest
          else
            echo "::warning::No updater artifacts found on $tag"
          fi
