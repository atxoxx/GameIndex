[package]
name = "gameindex"
version = "0.1.0"
description = "A unified game library application"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gameindex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Global hotkeys for the in-game overlay toggle (registered from Rust, not
# JS). Version 2 matches the rest of the plugin set.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
# Auto-launch the app on system boot (Windows / macOS / Linux). The
# `MacosLauncher::LaunchAgent` arg makes the macOS build use a per-user
# LaunchAgent — the only launcher the modern macOS allows without
# helper entitlements. We pass an empty `args` here because the user
# can boot the app into a regular visible window (the `--minimized`
# boot-flag is intentionally not exposed; adding it would require a
# second settings tile and a second kv key, and only one user asked
# for it). `withGlobalTauri` is on so the frontend can subscribe to
# the backend's "discord-presence-update" event too.
tauri-plugin-autostart = "2"
base64 = "0.22"
mime_guess = "2.0.5"
scraper = "0.22"
# `stream` (bytes_stream) is used directly by updater.rs; librqbit 8.x
# pulled it in transitively but 9.x no longer enables that feature.
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "blocking", "stream", "rustls-tls"] }
# Embedded JS engine for the plugin sandbox (quickjs-ng via quickjs-sys).
# Used to run user-installed `plugins/*.js` search scripts with injected
# httpGet/httpGetJson/definePlugin globals. Default features are enough:
# `Function::new`/`Ctx`/`Object` are core in 0.9, and we deliberately
# leave `rust-alloc`/`allocator` OFF so `Runtime::set_memory_limit` is a
# real cap (it is a no-op under a custom allocator).
rquickjs = "0.9"
# Torznab/RSS feed parser for `httpGetXml` in the plugin sandbox.
# Pinned to 0.41 (RUSTSEC-2026-0194/0195 fixes) — also the version
# librqbit-upnp 9.x resolves to, so the graph keeps one quick-xml.
quick-xml = "0.41"
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["clock"] }
urlencoding = "2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
# Work-stealing pool for the CPU/IO-bound directory scans (folder import,
# store-sync size measurement, ROM folders, exe resolution). These loops
# were single-threaded and made large imports stall on multi-core
# machines; rayon spreads one tree walk across every core. The size
# walker shares this same global pool, so a store sync that measures
# many installs doesn't spawn a second thread pool per folder.
rayon = "1"
# === Phase 0–4 storage layer ===
# Atomic write helper: writes to a sibling .tmp file then fs::rename for
# crash-safe persistence. Used by every legacy JSON write until the
# corresponding DAO migration lands in Phase 1–3.
tempfile = "3"
# SQLite (bundled — no system library required on Win/Mac/Linux).
#
# Pinned to 0.31 because r2d2_sqlite 0.24 declares a transitive
# dependence on rusqlite ^0.31. Two different rusqlite majors can't
# coexist in Cargo's dep graph because both link `libsqlite3-sys`
# with `links = "sqlite3"`. Bumping r2d2_sqlite to 0.25 (which
# targets rusqlite 0.32) is also fine — pick one. We pin rusqlite to
# 0.31 + r2d2_sqlite 0.24 to keep the existing API surface stable.
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
# Connection pool so concurrent Tauri commands don't fight for a single
# SQLite handle. SqliteConnectionManager is sync; we call DB methods
# directly inside async commands (the queries are sub-millisecond on
# WAL-mode local files).
r2d2 = "0.8"
r2d2_sqlite = "0.24"
# OS keychain for OAuth tokens / debrid API keys (Phase 4).
# keyring 3 ships NO default features, so each native backend must be
# opted into explicitly — without windows-native / apple-native it
# silently falls back to the in-memory mock store (secrets appear to
# save, then read back as NoEntry on the next Entry). We enable
# windows-native (Credential Manager), apple-native (macOS Keychain)
# and sync-secret-service for Linux boxes with Gnome Keyring /
# KWallet. `crypto-rust` keeps the secret-service transport encrypted
# with a pure-Rust impl and avoids the openssl-sys transitive dep — we
# deliberately do NOT use `vendored` (that's an openssl-sys feature,
# not keyring's).
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
    "crypto-rust",
] }
# Steam login helpers (encrypt_password + token extraction).
# Phase 4 keeps these crates here because the original Steam
# auth.rs already used them; the migration only changes WHERE we
# persist tokens (file -> OS keychain), not the encryption flow.
rand = "0.8"
sha2 = "0.10"
# MD5 for Nexus Mods file identification (`md5_search` endpoint hashes
# the local artifact and asks Nexus which mod it belongs to — the same
# linking trick Vortex uses for manually-installed mods).
md-5 = "0.10"
# SHA-1 for BIOS-file validation against known-good dump hashes
# (`roms::check_bios_status`). Pure-Rust, already in the lock graph
# transitively via other crates.
sha1 = "0.10"
# ZIP extraction for RetroAchievements ROM-hash matching (the RA client
# hashes the first file inside a `.zip` ROM, skipping archives >20 MB).
# `default-features = false` + `deflate` keeps the direct dependency
# minimal; the crate is already in the lock graph transitively.
zip = { version = "4", default-features = false, features = ["deflate"] }
# 7z extraction for ROM archives (`roms::extract_rom_archive`). Migrated off
# `sevenz-rust`, which is abandoned and has an unpatched path traversal
# (RUSTSEC-2026-0245); `sevenz-rust2` rejects escaping entry names in
# `safe_join`. `util` only — the old crate defaulted to LZMA decode too.
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util"] }
# RAR extraction for the mod installer — Nexus Mods (and friends) ship a
# meaningful share of archives as `.rar`, which previously fell back to the
# manual install modal. `unrar-ng` is the maintained MIT/Apache-2.0 fork of
# `unrar`; it wraps libunrar (extraction only — the unRAR restriction forbids
# re-creating the compressor) rather than the pure-Rust `unrar-rs`, which is
# GPL-3.0-or-later and would relicense this MIT app. The trade-off is a
# vendored C++ compile via `cc`, which MSVC handles on Windows.
unrar-ng = "0.7"
# Steam `appcache/appinfo.vdf` binary parsing — counts a Steam game's
# launch actions so the edit modal can hint about the launch-picker
# option (`steam://launch/<appid>/dialog`). Pure-Rust, no binary deps.
steam-vdf-parser = "0.1"
# minisign verification for the portable-update path (updater.rs).
# Already in the tree via tauri-plugin-updater — zero new resolution.
minisign-verify = "0.2"
# Rockstar uninstall-string parsing (mirrors Playnite's
# `Regex.Match(UninstallString, @"(?:Launcher|uninstall)\.exe.+uninstall=(.+)$")`).
regex = "1"
# POSIX shell-word splitting for launch arguments on non-Windows — quoted
# values like `+exec "my file.cfg"` must arrive as ONE argv entry instead
# of being mangled by whitespace splitting. Already in the lock graph
# (transitive via build deps), so this adds no new resolution.
shlex = "2"
# YAML parsing for the Ubisoft Connect local product cache. Playnite's
# `Uplay.GetLocalProductCache` deserializes each cache entry's `GameInfo`
# as a YAML `ProductInformation` document; we mirror that with serde_yaml.
serde_yaml = "0.9"
# Torrent engine. Pure-Rust, no C++/Boost/MSVC build step on Windows.
# Pinned to a major version (`9`) — librqbit's API moves fast and we
# want `cargo update` to refuse silent breaking changes.
#
# Bumped from 7.x to 8.x because 7.0.1 has a broken dep graph:
# `librqbit 7.0.1` → `librqbit-core 4.1.0`, but its sub-deps
# `librqbit-dht 5.3.1` and `librqbit-peer-protocol 4.3.0` →
# `librqbit-core 5.0.0`. Both versions land in the build and librqbit
# 7.0.1 fails to compile (every call to `iter_filenames_and_lengths`,
# `Magnet::from_id20`, etc. is mismatched). librqbit 8.x unified the
# dep graph on `librqbit-core 5.x` end-to-end; 9.x adds IPv6
# (dualstack listeners, IPv6 trackers/DHT), opt-in uTP, disk/perf
# rework and BEP-52 groundwork.
#
# Feature notes:
# - `default-tls` enables rustls for HTTPS magnet/`.torrent` URL fetching.
# - `http-api` is left OFF — we only use the in-process async API, not
#   the embedded HTTP server. Saves the axum/serde_html_form dep tree.
# - Upload disablement is configured at runtime via `SessionOptions`.
#   The `disable_upload` field is a runtime toggle in 9.x.
librqbit = { version = "9", default-features = false, features = ["default-tls"] }
igd-next = "0.17"
# Magnet URI parsing — extract the info-hash, trackers, and
# exact-topic fields without rolling our own URI parser.
url = "2"
discord-rich-presence = "1.1.0"
# Compile-time string obfuscation for embedded API credentials (config.rs
# accessors). XOR-encrypts the baked-in values so `strings`/hexdump on the
# binary doesn't reveal them. Extraction-bar only — not real secrecy; the
# decryption material lives in the binary too.
obfstr = "0.4"
# Pure-Rust, dependency-free JPEG encoder for the overlay's `jpg` screenshot
# format. The PNG path stays hand-rolled (no decoder/encoder dep); this only
# covers the optional lossy format so screenshots can be a fraction of the size.
jpeg-encoder = "0.6"

# === Security patches ===
# `librqbit` 9.0.1 (the newest release) depends on `librqbit-utp` 0.7.0,
# which pins `ringbuf ^0.4`. ringbuf 0.4.8 has a double-free /
# use-after-free in `Consumer::skip` and `Consumer::clear` when an
# element's `Drop` panics (RUSTSEC-2026-0293); the fix is >= 0.5.2 and no
# 0.4.x release carries it. librqbit-utp 0.7.0 is also the newest
# published version, so we pin the crate to the upstream commit that
# adopts ringbuf 0.5.2 - the ring buffer API it uses is unchanged there,
# so no source edits are needed. Remove this patch (and re-run
# `cargo update`) once a released librqbit-utp depends on ringbuf 0.5+.
[patch.crates-io]
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", rev = "f119a999657d66fe2c2322613428241ce8a69f23" }

# Dev builds previously ran this crate and every bundled C dependency
# (SQLite, QuickJS, serde_json) at `opt-level = 0`, which made a large
# library boot several times slower in `tauri dev` than in release.
# Opt-level 1 for the crate keeps rustc itself fast; opt-level 2 for the
# dependencies (compiled once, then cached) recovers most of the runtime.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The gameindex crate compiles with a single codegen unit to dodge a rustc
# codegen bug: the default multi-CGU split + `-Zshare-generics` emits
# references to drop-glue/outlined monomorphizations that never get defined,
# so the final link fails with "undefined hidden symbol" under rust-lld.
# Dependencies keep the default CGU split (profile above).
[profile.dev.package.gameindex]
codegen-units = 1

# Release profile tuned for runtime performance while keeping link times sane.
[profile.release]
opt-level = 3        # Aggressive runtime performance optimizations
lto = "thin"         # ThinLTO: most of fat LTO's cross-crate inlining at a fraction of the link time
codegen-units = 4    # Parallel CGUs so the long-running backend crates link in reasonable time
strip = true         # Automatically strips symbols and debuginfo, significantly reducing executable size
panic = "unwind"     # Preserves catch_unwind safety in telemetry/metrics collector

# ── Windows-only dependencies ──────────────────────────────────────
[target.'cfg(windows)'.dependencies]
wmi = "0.14"
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Kernel",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  # In-game video capture (capture/windows.rs): Windows Graphics Capture +
  # Direct3D11 + Media Foundation.
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Foundation",
] }

# ── Linux-only dependencies ────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.17"
libc = "0.2"
gtk = { version = "0.18" }
# WebKitGTK is the Linux webview engine. Used to shrink its image/page caches
# (see `webkit_memory.rs`) — WebKit memoizes decoded artwork far more
# aggressively than WebView2, which is what drives the render process into
# gigabytes on a large library.
webkit2gtk = "2"
# X11 overlay support: screen capture (GetImage/XShm), EWMH always-on-top
# (_NET_WM_STATE_ABOVE), and click-through via an empty XFixes/SHAPE input
# region. Pure-Rust bindings — no libX11 headers required at build time.
x11rb = { version = "0.14", features = ["shm", "shape", "xfixes"] }
# wlr-layer-shell: the only way to pin a window above a fullscreen game on
# Wayland (sway/Hyprland/KWin). No-op on X11 and unsupported on GNOME.
# `v0_6` chains v0_5/v0_4 and gates `set_keyboard_mode` + `is_supported`;
# the crate enables nothing by default.
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# XDG Desktop Portal client (zbus-backed). Used on Wayland for screenshots
# (org.freedesktop.portal.Screenshot) and global hotkeys
# (org.freedesktop.portal.GlobalShortcuts), which have no X11 equivalent.
ashpd = { version = "0.13", features = ["screencast", "screenshot", "global_shortcuts"] }
# Decode the PNG the Wayland Screenshot portal writes to disk before we
# re-encode it in the user's chosen format. Pure-Rust, light.
png = "0.17"


